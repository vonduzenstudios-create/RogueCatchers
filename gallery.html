<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RogueCatchers Art Gallery</title>
    <style>
      body { margin: 0; padding: 16px; background: #1b1f3b; color: #f4f1e8; font: 14px/1.4 system-ui, sans-serif; }
